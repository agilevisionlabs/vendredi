[package]
name = "vendredi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
vendredi-core.workspace = true
vendredi-transports.workspace = true
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11", "wayland"] }
tempfile = "3"
toml_edit = { version = "0.25", features = ["serde"] }
rfd = "0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.22.0", default-features = false }
