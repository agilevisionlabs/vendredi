[workspace]
resolver = "3"
members = ["crates/core", "crates/transports", "crates/app", "crates/script-guest"]
default-members = ["crates/app"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
wasmtime = { version = "50.0.2", default-features = false, features = ["std", "pulley", "anyhow"] }
flate2 = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vendredi-core = { path = "crates/core" }
vendredi-transports = { path = "crates/transports" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
